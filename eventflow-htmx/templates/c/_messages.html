<div id="messages">
  {% if messages %}
    <div class="container" style="margin-top: 24px;">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" style="padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; font-size: 14px;">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
</div>
