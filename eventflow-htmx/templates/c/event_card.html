{% partialdef card inline %}
<div class="event-card {% if event.is_past %}past{% endif %}">
  {% if event.is_past %}
  <div class="event-card-ended-badge">Encerrado</div>
  {% endif %}

  <img
    src="{% if event.image %}{{ event.image.url }}{% else %}https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?w=500&auto=format&fit=crop&q=60{% endif %}"
    alt="{{ event.title }}" class="event-card-image" />

  <div class="event-card-content">
    <span class="event-card-category">
      {{ event.get_category_display }}
    </span>

    <h3 class="event-card-title" title="{{ event.title }}">{{ event.title }}</h3>

    <div class="event-card-meta">
      📅 {{ event.date|date:"d \d\e F \d\e Y"|lower }} às {{ event.time|time:"H:i" }}h
    </div>

    <div class="event-card-meta">
      📍 {{ event.location }}
    </div>

    <div class="event-card-footer">
      <a href="{% url 'event-details' event.id %}" class="btn btn-sm btn-outline"
        style="width: 100%; justify-content: center;">
        Ver Detalhes
      </a>
    </div>
  </div>
</div>
{% endpartialdef %}
