{% extends "base.html" %}

{% block content %}
{% partialdef content inline %}
<main class="container">
  <div class="auth-container">
    <h1 class="auth-title">Entrar no EventFlow</h1>
    <p class="auth-subtitle">Acesse sua conta para gerenciar e se inscrever em eventos.</p>

    {% if error %}
      <div class="alert alert-danger" style="margin-bottom: 20px;">
        ⚠️ {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}{% if next %}?next={{ next }}{% endif %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label" for="username">Nome de Usuário</label>
        <input
          type="text"
          id="username"
          name="username"
          value="{{ username|default:'' }}"
          class="form-input"
          placeholder="Ex: sofia_regis"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="Sua senha secreta"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">
        Acessar Conta
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 14px;">
      Não tem uma conta? <a href="{% url 'register' %}">Cadastre-se aqui</a>
    </div>
  </div>
</main>
{% endpartialdef %}
{% endblock %}
