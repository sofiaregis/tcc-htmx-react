<div id="navbar">
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="{% url 'home' %}" class="logo">
        ⚡ Event<span>Flow</span>
      </a>

      <div class="nav-links">
        <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name in 'home search highlighted-events today-events' %}active{% endif %}">
          Eventos
        </a>

        {% if request.user.is_authenticated %}
          <a href="{% url 'my-registrations' %}" class="nav-link {% if request.resolver_match.url_name == 'my-registrations' %}active{% endif %}">
            Minhas Inscrições
          </a>
          <a href="{% url 'my-events' %}" class="nav-link {% if request.resolver_match.url_name in 'my-events event-create event-edit event-registrations' %}active{% endif %}">
            Painel do Organizador
          </a>
          <span class="text-muted" style="font-size: 14px; font-weight: 500; margin-left: 8px;">
            Olá, <strong>{{ request.user.username }}</strong>
          </span>
          <a href="{% url 'logout' %}" class="btn btn-sm btn-outline">
            Sair
          </a>
        {% else %}
          <a href="{% url 'login' %}" class="nav-link {% if request.resolver_match.url_name == 'login' %}active{% endif %}">
            Entrar
          </a>
          <a href="{% url 'register' %}" class="btn btn-sm btn-primary">
            Cadastrar-se
          </a>
        {% endif %}
      </div>
    </div>
  </nav>
</div>
