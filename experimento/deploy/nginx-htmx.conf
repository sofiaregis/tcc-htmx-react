# Configuração do Nginx do HTMX em produção.
# - Serve arquivos estáticos (/static/) e mídias (/media/) diretamente em nível de kernel (sendfile).
# - Encaminha requisições dinâmicas MVT via proxy_pass para o Gunicorn (htmx-backend:8000).
# Montado em /etc/nginx/conf.d/default.conf

server {
    listen 8080;
    server_name _;

    # Compressão Gzip para arquivos estáticos e respostas dinâmicas
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml;

    # Arquivos estáticos (CSS, JS do HTMX, ícones)
    location /static/ {
        alias /data/static/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Imagens de eventos (servidas diretamente do volume de mídia com zero-copy)
    location /media/ {
        alias /data/media/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Rotas dinâmicas do Django / HTMX
    location / {
        proxy_pass http://htmx-backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
