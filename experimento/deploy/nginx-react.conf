# Configuração do Nginx do frontend React (SPA) em produção.
# - Serve o dist/ do build de produção (arquivos estáticos, JS, CSS, HTML).
# - Encaminha /api/ para o backend Django (mesma origem, sem CORS).
# - Serve mídias (/media/) diretamente do volume com as mesmas regras de cache do HTMX.
# Montado em /etc/nginx/conf.d/default.conf

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para arquivos estáticos e respostas dinâmicas
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml;

    # Imagens e mídias de eventos (servidas diretamente do volume com as mesmas regras do HTMX)
    location /media/ {
        alias /data/media/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Encaminhamento da API REST para o Gunicorn (react-backend:8000)
    location /api/ {
        proxy_pass http://react-backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # SPA: qualquer rota de página cai no index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
